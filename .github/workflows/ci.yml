name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer commit on a pull request cancels the older run of that pull request.
# Every push to main keeps its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # In a private repository a macOS minute costs about ten Linux minutes, so
        # there this workflow runs Linux only, and ci-macos.yml runs macOS when the
        # macOS code changes. A public repository runs both systems for free.
        # Ubuntu is pinned to 24.04. The 26.04 image has no bwrap-userns-restrict
        # file under extra-profiles, and the install step below copies that file.
        os: ${{ fromJSON(github.event.repository.private && '["ubuntu-24.04"]' || '["ubuntu-24.04", "macos-latest"]') }}
        node: [20, 22, 24, 26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install the Linux execution boundary
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap apparmor-profiles
          # Ubuntu restricts unprivileged namespaces. Use its supplied policy
          # for bwrap without disabling AppArmor across the runner.
          sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
      - name: Check Linux namespace support
        if: runner.os == 'Linux'
        run: bwrap --unshare-all --ro-bind / / --proc /proc --dev /dev -- /usr/bin/true
      - run: npm run test:boundaries
      - run: npm run check
      - run: npm test
